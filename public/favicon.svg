<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Modern chart icon for budget management -->
  <!-- Background with subtle gradient effect -->
  <rect width="32" height="32" rx="6" fill="#0070f3"/>
  
  <!-- Chart bars representing financial growth -->
  <rect x="6" y="20" width="3" height="8" fill="#ffffff" rx="0.5" opacity="0.9"/>
  <rect x="11" y="16" width="3" height="12" fill="#ffffff" rx="0.5" opacity="0.95"/>
  <rect x="16" y="12" width="3" height="16" fill="#ffffff" rx="0.5"/>
  <rect x="21" y="8" width="3" height="20" fill="#ffffff" rx="0.5"/>
  
  <!-- Subtle accent line at the top -->
  <line x1="8" y1="6" x2="24" y2="6" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>

