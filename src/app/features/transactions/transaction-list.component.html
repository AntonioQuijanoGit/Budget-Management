<ui-card eyebrow="History" title="Transactions" [hoverable]="true">
  <ui-badge variant="neutral" size="sm">
    {{ transactions.length }} items
  </ui-badge>

  <div *ngIf="hasItems; else empty">
    <div class="list">
      <app-transaction-card
        *ngFor="let tx of transactions"
        [transaction]="tx"
        [category]="findCategory(tx.categoryId)"
        (edit)="edit.emit($event)"
        (remove)="remove.emit($event)"
      ></app-transaction-card>
    </div>
  </div>

  <ng-template #empty>
    <ui-empty-state
      icon="TrendingUp"
      title="Add Your First Transaction"
      description="Start managing your finances by adding your first income or expenses."
    >
      <ui-button 
        variant="primary" 
        size="lg"
        iconLeft="Plus"
        (buttonClick)="scrollToForm()"
        class="empty-cta-button"
      >
        Add Transaction
      </ui-button>
    </ui-empty-state>
  </ng-template>
</ui-card>
