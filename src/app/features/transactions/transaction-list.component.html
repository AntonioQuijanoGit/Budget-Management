<ui-card eyebrow="History" title="Transactions" [hoverable]="true">
  <ui-badge variant="neutral" size="sm">
    {{ transactions.length }} items
  </ui-badge>

  <div *ngIf="hasItems; else empty">
    <div class="list">
      <app-transaction-card
        *ngFor="let tx of transactions"
        [transaction]="tx"
        [category]="findCategory(tx.categoryId)"
        (edit)="edit.emit($event)"
        (remove)="remove.emit($event)"
      ></app-transaction-card>
    </div>
  </div>

  <ng-template #empty>
    <ui-empty-state
      icon="Wallet"
      title="Start Tracking Your Finances"
      description="Add your first transaction to begin managing your budget. Track income, expenses, and see your financial overview in real-time."
    >
      <ui-button 
        variant="primary" 
        size="lg"
        iconLeft="Plus"
        (buttonClick)="scrollToForm()"
        class="empty-cta-button"
      >
        Add Your First Transaction
      </ui-button>
      <p style="margin-top: var(--space-4); font-size: var(--font-size-sm); color: var(--color-text-secondary);">
        💡 Tip: Start by adding your monthly income, then track your expenses
      </p>
    </ui-empty-state>
  </ng-template>
</ui-card>
