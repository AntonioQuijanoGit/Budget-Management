<article class="tx-card">
  <div class="tx-main">
    <div class="tx-icon" [class.income-icon]="transaction.type === 'income'" [class.expense-icon]="transaction.type === 'expense'">
      <lucide-icon 
        [name]="transaction.type === 'income' ? 'TrendingUp' : 'TrendingDown'" 
        [size]="20"
      ></lucide-icon>
    </div>
    <div class="tx-info">
      <p class="tx-desc">{{ transaction.description }}</p>
      <p class="tx-meta">
        <span>{{ category?.name || 'Uncategorized' }}</span>
        <span>•</span>
        <span>{{ transaction.date | date: 'mediumDate' }}</span>
      </p>
    </div>
  </div>
  <div class="tx-actions">
    <div class="tx-amount" [class.income]="transaction.type === 'income'">
      {{ amountLabel }}
    </div>
    <div class="tx-buttons">
      <button class="action-btn" (click)="onEdit()" aria-label="Edit transaction">
        <lucide-icon name="Pencil" [size]="16"></lucide-icon>
        <span>Edit</span>
      </button>
      <button class="action-btn danger" (click)="onRemove()" aria-label="Delete transaction">
        <lucide-icon name="Trash2" [size]="16"></lucide-icon>
        <span>Delete</span>
      </button>
    </div>
  </div>
</article>
