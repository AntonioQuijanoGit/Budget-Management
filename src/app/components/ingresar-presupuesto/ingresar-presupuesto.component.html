<section class="budget-page" role="main">
  <ui-card eyebrow="Budget" title="Define your budget" [hoverable]="true" padding="lg">
    <p class="muted">
      Enter the total amount available. Each transaction will reduce it to show you the remaining balance.
    </p>

    <form class="stack" (ngSubmit)="agregar()" aria-label="Budget form" novalidate>
      <ui-input
        label="Total amount"
        name="budget"
        type="number"
        [ngModel]="cantidad"
        (ngModelChange)="onInputChange($event)"
        [error]="cantidadIncorrecta() ? 'Budget must be greater than zero' : ''"
        [min]="0"
        [step]="0.01"
        placeholder="500.00"
        suffix="EUR"
        [required]="true"
      ></ui-input>

      <p class="helper">
        Example: if you have €500 for the month, enter 500.00. Each expense will subtract from the available amount.
      </p>

      <ui-button type="submit" variant="primary" [loading]="isSubmitting()">
        Start
      </ui-button>
    </form>
  </ui-card>
</section>
