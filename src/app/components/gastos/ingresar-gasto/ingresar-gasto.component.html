<section class="expense-card" aria-labelledby="expense-form-title">
  <ui-card eyebrow="Expense" title="Add an expense" [hoverable]="true">
    <p class="muted">Record what you spent; it will be automatically subtracted from your budget.</p>

    <div class="banner error" *ngIf="error().show" role="alert" aria-live="assertive">
      {{ error().message }}
    </div>
    <div class="banner success" *ngIf="successMessage()" role="status" aria-live="polite">
      {{ successMessage() }}
    </div>

    <form class="stack" (ngSubmit)="agregarGasto()" aria-label="Expense input form" novalidate>
      <ui-input
        label="Expense name"
        name="nombre"
        [ngModel]="nombreGasto()"
        (ngModelChange)="onNombreChange($event)"
        [error]="errorMessage && nombreGasto().trim() === '' ? errorMessage : ''"
        placeholder="Groceries, Coffee, Gas..."
        [maxlength]="50"
        [required]="true"
      ></ui-input>

      <ui-input
        label="Amount"
        name="cantidad"
        type="number"
        [ngModel]="cantidad()"
        (ngModelChange)="onCantidadChange($event)"
        [error]="errorMessage"
        placeholder="0.00"
        [min]="0"
        [max]="restanteDisponible"
        [step]="0.01"
        suffix="EUR"
        [required]="true"
      ></ui-input>

      <p class="helper">
        Available: <strong>{{ (restanteDisponible | number:'1.2-2') || '0.00' }} EUR</strong>
      </p>

      <ui-button type="submit" variant="primary" [loading]="isSubmitting()">
        Add Expense
      </ui-button>
    </form>
  </ui-card>
</section>
