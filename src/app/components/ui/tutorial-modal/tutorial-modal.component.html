<div class="tutorial-overlay" *ngIf="open">
  <div class="tutorial-card" role="dialog" aria-modal="true" aria-label="App tutorial">
    <div class="tutorial-progress">
      <div class="tutorial-bar" [style.width.%]="((step+1)/steps.length)*100"></div>
    </div>
    <div class="tutorial-body">
      <div class="tutorial-figure" aria-hidden="true">
        <ng-container *ngIf="steps[step]?.img; else placeholder">
          <img [src]="steps[step].img" [alt]="steps[step].title" />
        </ng-container>
        <ng-template #placeholder>
          <div class="placeholder-img">Step {{ step+1 }}</div>
        </ng-template>
      </div>
      <div class="tutorial-text">
        <p class="eyebrow">Tutorial</p>
        <h2>{{ steps[step].title }}</h2>
        <p class="desc">{{ steps[step].desc }}</p>
      </div>
    </div>
    <div class="tutorial-dots" aria-hidden="true">
      <span *ngFor="let s of steps; let i = index" [class.active]="i === step"></span>
    </div>
    <div class="tutorial-actions">
      <ui-button variant="ghost" size="sm" (buttonClick)="onSkip()">Skip</ui-button>
      <div class="spacer"></div>
      <ui-button variant="ghost" size="sm" [disabled]="step===0" (buttonClick)="onPrev()">Back</ui-button>
      <ui-button variant="primary" size="sm" (buttonClick)="step === steps.length-1 ? onClose() : onNext()">
        {{ step === steps.length-1 ? 'Start now' : 'Next' }}
      </ui-button>
    </div>
    <button class="close" type="button" aria-label="Close tutorial" (click)="onClose()">
      <lucide-icon name="X" [size]="16"></lucide-icon>
    </button>
  </div>
</div>
