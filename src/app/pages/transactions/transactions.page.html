<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Transactions</p>
      <h1 class="page-title">Manage Your Income & Expenses</h1>
      <p class="page-subtitle">
        Add, edit, or delete transactions. Filter by category, date, and search quickly.
      </p>
    </div>
    <div class="header-actions">
      <div class="header-search">
        <ui-search 
          placeholder="Search transactions..." 
          [value]="searchQuery()"
          (valueChange)="onSearchChange($event)"
        ></ui-search>
      </div>
      <ui-button 
        variant="primary" 
        iconLeft="Plus"
        (buttonClick)="scrollToForm()"
        class="header-add-button"
      >
        Add Transaction
      </ui-button>
    </div>
  </header>

  <div class="page-grid">
    <div class="left">
      <app-transaction-form
        [categories]="categories()"
        [editing]="editing()"
        (save)="handleSave($event)"
        (cancelEdit)="cancelEdit()"
      ></app-transaction-form>
    </div>
    <div class="right">
      <app-transaction-filters
        [categories]="categories()"
        [value]="filtersSvc.filters()"
        (change)="onFiltersChange($event)"
      ></app-transaction-filters>
      <app-transaction-list
        [transactions]="filtered()"
        [categories]="categories()"
        (edit)="handleEdit($event)"
        (remove)="handleRemove($event)"
        (addTransaction)="scrollToForm()"
      ></app-transaction-list>
    </div>
  </div>

  <!-- Delete confirmation modal -->
  <ui-modal
    [open]="deletingId() !== null"
    title="Delete Transaction?"
    description="This action cannot be undone"
    size="sm"
    (close)="cancelDelete()"
  >
    <p *ngIf="deletingTransaction()">
      Are you sure you want to delete the transaction 
      <strong>"{{ deletingTransaction()?.description }}"</strong>?
    </p>
    
    <div modal-footer style="display: flex; gap: var(--space-3); justify-content: flex-end;">
      <ui-button variant="ghost" (buttonClick)="cancelDelete()">
        Cancel
      </ui-button>
      <ui-button variant="danger" iconLeft="Trash2" (buttonClick)="confirmDelete()">
        Delete
      </ui-button>
    </div>
  </ui-modal>
</section>
